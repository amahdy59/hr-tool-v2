name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Code Review (Typecheck, Manifest, i18n Parity, RTL Linter)
        run: npm run check:code

      - name: Dead Code Audit (Knip)
        run: npm run check:deadcode

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Accessibility Review (WCAG 2.2 AAA Axe-core)
        run: npm run check:a11y 2>&1 | tee a11y.log

      - name: Responsiveness Review (7 Standard Viewports)
        run: npm run check:responsive 2>&1 | tee responsive.log

      - name: Visual Regression Review (Pixelmatch)
        run: npm run check:visual 2>&1 | tee visual.log

      - name: End-to-End Tests
        run: npm run test:e2e 2>&1 | tee e2e.log

      - name: Generate Quality Summary
        if: always()
        run: |
          echo "## 🛡️ Automated Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Standard |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Review** | TypeScript, PWA Manifest, i18n Parity, RTL Linter |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dead Code Audit** | Knip Zero Dead Files / Unused Dependencies |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit Tests** | 29 Vitest Domain & Logic Tests |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Build** | Vite PWA Bundle |" >> $GITHUB_STEP_SUMMARY
          echo "| **Accessibility Review** | WCAG 2.2 AAA (0 Violations) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Responsiveness Review** | 7 Viewports (320px–1440px, 0 Overflow) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual Regression** | Pixelmatch Baseline Match |" >> $GITHUB_STEP_SUMMARY
          echo "| **E2E Integration** | Complete User Flows & RTL Parity |" >> $GITHUB_STEP_SUMMARY
          if [ -f a11y.log ]; then
            echo "<details><summary>♿ Accessibility Logs</summary><pre><code>" >> $GITHUB_STEP_SUMMARY
            cat a11y.log >> $GITHUB_STEP_SUMMARY
            echo "</code></pre></details>" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f responsive.log ]; then
            echo "<details><summary>📱 Responsiveness Logs</summary><pre><code>" >> $GITHUB_STEP_SUMMARY
            cat responsive.log >> $GITHUB_STEP_SUMMARY
            echo "</code></pre></details>" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f visual.log ]; then
            echo "<details><summary>🖼️ Visual Regression Logs</summary><pre><code>" >> $GITHUB_STEP_SUMMARY
            cat visual.log >> $GITHUB_STEP_SUMMARY
            echo "</code></pre></details>" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f e2e.log ]; then
            echo "<details><summary>🧪 End-to-End Logs</summary><pre><code>" >> $GITHUB_STEP_SUMMARY
            cat e2e.log >> $GITHUB_STEP_SUMMARY
            echo "</code></pre></details>" >> $GITHUB_STEP_SUMMARY
          fi
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
